<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Solicitações online · Tec Lab</title>
<meta name="theme-color" content="#2f7d46">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Tec Lab">
<style>
:root{
  --verde:#2f7d46; --verde-esc:#1d5a31; --pill:#b9dfbd; --pill-txt:#1f4d2c; --papel:#ffffff;
  --fundo:#eef3ee; --linha:#8fa293; --txt:#1f2a22; --suave:#5f6f63; --erro:#b3261e; --aviso:#9a6700;
  --serif: Georgia, "Times New Roman", Times, serif;
  --sans: system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--fundo);color:var(--txt);font-family:var(--sans);font-size:16px;-webkit-text-size-adjust:100%}
a{color:var(--verde-esc)}
button{font:inherit;cursor:pointer}
input,select,textarea{font:inherit;color:inherit}
.oculto{display:none!important}

/* barra superior */
.topo{position:sticky;top:0;z-index:20;background:#fff;border-bottom:1px solid #d6e3d8;display:flex;align-items:center;gap:12px;padding:8px 14px;padding-top:max(8px,env(safe-area-inset-top))}
.topo img{height:34px}
.topo .tit{font-family:var(--serif);font-size:17px;color:var(--verde-esc);line-height:1.1}
.topo .tit small{display:block;font-family:var(--sans);font-size:12px;color:var(--suave)}
.topo .esp{flex:1}
.menu-btn{background:none;border:1px solid #cfdcd1;border-radius:8px;padding:6px 10px;color:var(--verde-esc)}
.menu{position:absolute;right:12px;top:54px;background:#fff;border:1px solid #d6e3d8;border-radius:10px;box-shadow:0 8px 24px rgba(0,0,0,.12);min-width:220px;overflow:hidden}
.menu a,.menu button{display:block;width:100%;text-align:left;padding:11px 16px;background:none;border:0;text-decoration:none;color:var(--txt)}
.menu a:hover,.menu button:hover{background:#f1f7f1}
.menu .quem{padding:10px 16px;font-size:13px;color:var(--suave);border-bottom:1px solid #eee}

.demo-faixa{background:#fff6d6;color:#6b5200;font-size:13px;padding:6px 14px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.demo-faixa label{display:flex;gap:6px;align-items:center}

main{max-width:1000px;margin:0 auto;padding:16px 12px 120px}

/* folha estilo requisição */
.folha{background:var(--papel);border-radius:6px;box-shadow:0 1px 3px rgba(0,0,0,.08);padding:22px 22px 26px;margin-bottom:16px}
.cab{display:flex;gap:18px;align-items:flex-start;flex-wrap:wrap}
.cab .marca{width:200px;text-align:center}
.cab .marca img{width:180px;display:block;margin:0 auto}
.cab .marca div{font-size:12px;color:#3d4a40;letter-spacing:.3px;margin-top:4px}
.cab .dir{flex:1;min-width:260px;text-align:center}
.cab h1{font-family:var(--serif);font-weight:normal;font-size:30px;margin:4px 0 2px;color:#222}
.cab .agende{font-family:var(--serif);font-weight:bold;font-size:17px;color:#333;text-decoration:none}
.cab .agende:hover{text-decoration:underline}
.flags{display:flex;gap:14px 22px;justify-content:center;flex-wrap:wrap;margin-top:14px;font-family:var(--serif);font-size:20px}
.flags label{display:flex;align-items:center;gap:6px;cursor:pointer}
.urg{background:var(--verde);color:#fff;padding:2px 8px;font-weight:bold}
.urg+small{font-size:14px}

.pill{display:inline-block;background:var(--pill);color:var(--pill-txt);font-family:var(--serif);font-size:19px;padding:4px 12px;border-radius:9px;white-space:nowrap}
.pill.sec{font-weight:bold;font-size:16px;letter-spacing:.3px;text-transform:uppercase;padding:5px 14px}
.lin{display:flex;align-items:flex-end;gap:10px;flex-wrap:wrap;margin-top:12px}
.campo{display:flex;align-items:flex-end;gap:8px;flex:1 1 220px;min-width:0}
.campo.curto{flex:0 1 170px}
.campo.medio{flex:1 1 200px}
input.ln, select.ln{border:0;border-bottom:1.5px solid var(--linha);background:transparent;padding:6px 2px;outline:none;flex:1;min-width:0;font-size:17px}
input.ln:focus,select.ln:focus,textarea:focus{border-color:var(--verde)}
.seg{display:flex;gap:4px}
.seg label{border:1.5px solid var(--linha);border-radius:7px;padding:4px 12px;cursor:pointer;font-family:var(--serif);font-size:18px}
.seg input{position:absolute;opacity:0;pointer-events:none}
.seg label:has(input:checked){background:var(--verde);border-color:var(--verde);color:#fff}
.cert{font-family:var(--serif);font-style:italic;font-size:14px;color:#444;display:flex;gap:8px;align-items:flex-start;margin-top:12px}
.data{font-family:var(--serif);font-weight:bold;font-size:16px;margin-left:auto}

.div{border:0;border-top:1.5px solid #6e7b70;margin:22px 0 14px;position:relative}
.secao{margin-top:6px}
.secao-cab{display:flex;align-items:center;gap:14px;flex-wrap:wrap;margin-bottom:10px}
.secao-cab .regua{flex:1;border-bottom:1.5px solid var(--linha);min-width:40px;margin-bottom:6px}
.grade{display:grid;grid-template-columns:repeat(auto-fill,minmax(225px,1fr));gap:2px 18px}
.grade.larga{grid-template-columns:repeat(auto-fill,minmax(320px,1fr))}
.item{padding:3px 0}
.ck{display:flex;align-items:flex-start;gap:8px;cursor:pointer;font-family:var(--serif);font-size:17px;line-height:1.25}
.ck input{appearance:none;-webkit-appearance:none;width:20px;height:20px;border:1.5px solid #555;border-radius:2px;flex:none;margin:1px 0 0;background:#fff;display:grid;place-content:center;cursor:pointer}
.ck input:checked{background:var(--verde);border-color:var(--verde)}
.ck input:checked::after{content:"";width:6px;height:11px;border:solid #fff;border-width:0 2.5px 2.5px 0;transform:rotate(45deg) translate(-1px,-1px)}
.ck small{font-family:var(--sans);font-size:12px;color:var(--suave)}
.ck .jejum{font-family:var(--sans);font-size:11px;font-weight:bold;background:#eef6ee;border-radius:4px;padding:1px 5px;color:var(--verde-esc);white-space:nowrap}
.sub{display:none;flex-wrap:wrap;gap:6px 8px;align-items:center;margin:4px 0 6px 28px}
.item.on .sub{display:flex}
.sub input[type=text]{border:0;border-bottom:1.5px solid var(--linha);padding:4px 2px;font-size:15px;min-width:120px;flex:1;outline:none;background:transparent}
.chips{display:flex;gap:4px;flex-wrap:wrap}
.chips label{border:1.5px solid var(--linha);border-radius:6px;padding:2px 9px;font-size:14px;cursor:pointer;user-select:none}
.chips input{position:absolute;opacity:0;pointer-events:none}
.chips label:has(input:checked){background:var(--verde);color:#fff;border-color:var(--verde)}
.texto-livre input{border:0;border-bottom:1.5px solid var(--linha);padding:4px 2px;font-size:15px;flex:1;outline:none;background:transparent}
.nota{font-family:var(--serif);font-size:15px;color:#333;text-align:center;margin:8px 0 0}
.nota.dir{text-align:right;font-style:italic;font-size:13px}
.obs{display:flex;gap:8px;align-items:flex-end;margin-top:10px;font-family:var(--serif);font-size:16px}
.obs input{flex:1}
.subtit{font-family:var(--serif);font-weight:bold;font-size:15px;color:var(--pill-txt);margin:14px 0 6px;text-transform:uppercase}
.lab-tit{font-family:var(--serif);font-weight:bold;font-size:22px;letter-spacing:.5px;margin:4px 0 8px}
textarea{width:100%;border:1.5px solid #c9d6cb;border-radius:8px;padding:8px 10px;font-size:16px;min-height:70px;resize:vertical;outline:none;background:#fff}

.mapa-wrap{display:flex;gap:20px;flex-wrap:wrap;align-items:flex-start;margin-top:10px}
.mapa{position:relative;width:320px;max-width:100%;user-select:none}
.mapa .rot{display:flex;justify-content:space-around;font-family:var(--serif);font-size:20px;margin-bottom:4px}
.mapa .img{position:relative;cursor:crosshair}
.mapa img{width:100%;display:block}
.mapa .ponto{position:absolute;width:22px;height:22px;margin:-11px 0 0 -11px;border-radius:50%;background:#d93025;color:#fff;font-size:12px;font-weight:bold;display:grid;place-content:center;box-shadow:0 0 0 2px #fff;cursor:pointer}
.mapa .dica{font-size:12px;color:var(--suave);margin-top:4px}
.locais{flex:1;min-width:260px}
.locais .pill{font-size:15px;font-weight:bold}

/* barra fixa de envio */
.barra{position:fixed;left:0;right:0;bottom:0;z-index:15;background:#fff;border-top:1px solid #d6e3d8;padding:10px 14px;padding-bottom:max(10px,env(safe-area-inset-bottom));display:flex;align-items:center;gap:10px;justify-content:center}
.barra .cont{font-size:14px;color:var(--suave);margin-right:auto;max-width:520px}
.barra-in{max-width:1000px;width:100%;display:flex;align-items:center;gap:10px}
.btn{border:0;border-radius:9px;padding:11px 18px;background:var(--verde);color:#fff;font-weight:600;font-size:15px}
.btn:hover{background:var(--verde-esc)}
.btn.sec{background:#fff;color:var(--verde-esc);border:1.5px solid #b8cdbb}
.btn.sec:hover{background:#f2f8f2}
.btn.perigo{background:#fff;color:var(--erro);border:1.5px solid #e6b8b4}
.btn.peq{padding:7px 12px;font-size:14px}
.btn:disabled{opacity:.55;cursor:default}

.nav-secoes{display:flex;gap:6px;overflow-x:auto;padding:2px 0 10px;scrollbar-width:none}
.nav-secoes a{flex:none;font-size:13px;text-decoration:none;background:#fff;border:1px solid #cfe0d2;border-radius:20px;padding:5px 12px;color:var(--verde-esc)}

/* login */
.login{max-width:420px;margin:30px auto;background:#fff;border-radius:12px;box-shadow:0 2px 10px rgba(0,0,0,.08);padding:26px 24px}
.login img{width:170px;display:block;margin:0 auto 4px}
.login .sub-marca{text-align:center;font-size:12px;color:#3d4a40;margin-bottom:14px}
.login h2{font-family:var(--serif);font-weight:normal;text-align:center;margin:6px 0 18px;font-size:24px}
.f{display:block;margin-bottom:12px}
.f span{display:block;font-size:13px;color:var(--suave);margin-bottom:4px}
.f input{width:100%;border:1.5px solid #c9d6cb;border-radius:8px;padding:10px 11px;font-size:16px;outline:none}
.f input:focus{border-color:var(--verde)}
.login .btn{width:100%;margin-top:4px}
.login .alt{text-align:center;margin-top:14px;font-size:14px}
.msg{border-radius:8px;padding:10px 12px;font-size:14px;margin-bottom:12px}
.msg.erro{background:#fdecea;color:var(--erro)}
.msg.ok{background:#e8f4ea;color:var(--verde-esc)}
.msg.aviso{background:#fff6d6;color:#6b5200}

/* listas */
.cab-lista{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin:4px 0 14px}
.cab-lista h2{font-family:var(--serif);font-weight:normal;font-size:24px;margin:0;flex:1}
.cartao{background:#fff;border-radius:10px;box-shadow:0 1px 3px rgba(0,0,0,.07);padding:14px 16px;margin-bottom:10px;display:flex;gap:14px;align-items:flex-start;flex-wrap:wrap}
.cartao .info{flex:1;min-width:220px}
.cartao .t{font-weight:600;font-size:16px}
.cartao .m{font-size:13px;color:var(--suave);margin-top:3px}
.cartao .ex{font-size:14px;margin-top:6px}
.cartao .acoes{display:flex;gap:6px;flex-wrap:wrap}
.st{display:inline-block;font-size:12px;font-weight:700;border-radius:20px;padding:3px 10px;white-space:nowrap}
.st.enviada{background:#fff1c2;color:#7a5a00}
.st.aceita{background:#dbeafe;color:#1e40af}
.st.cadastrada{background:#d9f0dd;color:#1d5a31}
.st.recusada{background:#fde2e0;color:#9b1c13}
.st.cancelada{background:#eceeec;color:#666}
.tag-urg{background:var(--verde);color:#fff;font-size:11px;font-weight:700;border-radius:4px;padding:2px 6px;margin-left:6px}
.vazio{text-align:center;color:var(--suave);padding:40px 10px;background:#fff;border-radius:10px}

.abas{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.abas button{border:1px solid #cfe0d2;background:#fff;border-radius:20px;padding:6px 14px;font-size:14px;color:var(--verde-esc)}
.abas button.on{background:var(--verde);border-color:var(--verde);color:#fff}
.abas .n{font-weight:700;margin-left:4px}
.busca{border:1.5px solid #c9d6cb;border-radius:9px;padding:9px 12px;font-size:15px;min-width:220px;flex:1;max-width:340px;outline:none}
.tabela{width:100%;border-collapse:collapse;background:#fff;border-radius:10px;overflow:hidden;box-shadow:0 1px 3px rgba(0,0,0,.07);font-size:14px}
.tabela th{background:#f1f7f1;text-align:left;font-weight:600;padding:9px 10px;color:var(--pill-txt);font-size:13px}
.tabela td{padding:9px 10px;border-top:1px solid #edf1ed;vertical-align:top}
.tabela tr.click{cursor:pointer}
.tabela tr.click:hover td{background:#f7fbf7}
.tabela tr.novo td{background:#fffbea}

/* visualização */
.ver-cab{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:12px}
.ver-cab .esp{flex:1}
.cod{font-family:var(--serif);font-size:22px;color:var(--verde-esc)}
.dados-grade{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:8px 18px;margin-top:12px}
.dado span{display:block;font-size:12px;color:var(--suave);text-transform:uppercase;letter-spacing:.3px}
.dado b{font-weight:600;font-size:16px}
.ver-sec{margin-top:16px}
.ver-sec ul{margin:6px 0 0;padding-left:20px}
.ver-sec li{margin:3px 0;font-family:var(--serif);font-size:17px}
.ver-sec li small{font-family:var(--sans);color:#444;font-size:14px}
.acoes-equipe{background:#fff;border:2px solid var(--pill);border-radius:10px;padding:14px;margin-bottom:14px;display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.acoes-equipe .esp{flex:1;min-width:180px;font-size:14px}
.rodape{text-align:center;font-family:var(--serif);font-weight:bold;font-size:14px;color:#333;margin-top:22px;line-height:1.6}
.rodape a{color:inherit}

/* modal */
.modal-fundo{position:fixed;inset:0;background:rgba(0,0,0,.35);z-index:50;display:grid;place-items:center;padding:16px}
.modal{background:#fff;border-radius:12px;max-width:460px;width:100%;padding:20px}
.modal h3{margin:0 0 10px;font-family:var(--serif);font-weight:normal;font-size:22px}
.modal .bts{display:flex;gap:8px;justify-content:flex-end;margin-top:14px}
.toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:#1f2a22;color:#fff;padding:10px 16px;border-radius:8px;z-index:60;font-size:14px;box-shadow:0 4px 14px rgba(0,0,0,.2)}
.carregando{text-align:center;padding:50px;color:var(--suave)}

@media (max-width:640px){
  .folha{padding:16px 14px 20px}
  .cab .marca{width:100%}
  .cab h1{font-size:24px}
  .flags{font-size:17px;gap:10px 16px}
  .pill{font-size:16px}
  .campo,.campo.curto,.campo.medio{flex:1 1 100%}
  .tabela .opc{display:none}
}
@media print{
  body{background:#fff}
  .topo,.demo-faixa,.barra,.nao-imprimir,.acoes-equipe{display:none!important}
  main{padding:0;max-width:none}
  .folha{box-shadow:none;padding:0}
  .pill{-webkit-print-color-adjust:exact;print-color-adjust:exact}
}
</style>
</head>

const $ = (s, r=document) => r.querySelector(s);
const $$ = (s, r=document) => [...r.querySelectorAll(s)];
const h = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const cod = id => 'SOL-' + String(id).padStart(5,'0');
const dataBR = iso => iso ? new Date(iso).toLocaleDateString('pt-BR') : '';
const horaBR = iso => iso ? new Date(iso).toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'}) : '';
const dh = iso => iso ? dataBR(iso) + ' ' + horaBR(iso) : '';
function toast(t, ms=2600){ const d=document.createElement('div'); d.className='toast'; d.textContent=t; document.body.appendChild(d); setTimeout(()=>d.remove(), ms); }
function modal({titulo, html='', campos=[], ok='Confirmar', cancelar='Voltar', perigo=false}){
  return new Promise(res=>{
    const f=document.createElement('div'); f.className='modal-fundo';
    f.innerHTML=`<div class="modal"><h3>${h(titulo)}</h3>${html}${campos.map(c=>`<label class="f"><span>${h(c.rotulo)}</span><input data-k="${c.k}" value="${h(c.valor||'')}" placeholder="${h(c.ph||'')}"></label>`).join('')}
      <div class="msg erro oculto"></div><div class="bts"><button class="btn sec">${h(cancelar)}</button><button class="btn ${perigo?'perigo':''}">${h(ok)}</button></div></div>`;
    document.body.appendChild(f);
    const [bC,bO]=$$('.bts button',f); const inp=$$('input',f);
    if(inp[0]) setTimeout(()=>inp[0].focus(),30);
    bC.onclick=()=>{f.remove();res(null)};
    bO.onclick=()=>{ const v={}; for(const i of inp){ v[i.dataset.k]=i.value.trim(); const c=campos.find(c=>c.k===i.dataset.k); if(c.obrig && !v[i.dataset.k]){ const m=$('.msg',f); m.textContent='Preencha: '+c.rotulo; m.classList.remove('oculto'); return; } } f.remove(); res(v); };
  });
}
function traduzErro(e){
  const m = (e && (e.message||e.error_description||e.msg)) || String(e);
  if(/Invalid login credentials/i.test(m)) return 'E-mail ou senha incorretos.';
  if(/already registered|already been registered/i.test(m)) return 'Este e-mail já tem cadastro. Use "Entrar" ou "Esqueci minha senha".';
  if(/at least 6|Password should/i.test(m)) return 'A senha precisa ter pelo menos 6 caracteres.';
  if(/Email not confirmed/i.test(m)) return 'Confirme seu e-mail pelo link que enviamos antes de entrar.';
  if(/rate limit|too many/i.test(m)) return 'Muitas tentativas em pouco tempo. Aguarde alguns minutos e tente de novo.';
  if(/valid email|invalid format|Unable to validate email/i.test(m)) return 'E-mail inválido.';
  if(/Failed to fetch|NetworkError|network/i.test(m)) return 'Sem conexão com o servidor. Verifique a internet e tente de novo.';
  return m;
}

/* ================== BACKEND: SUPABASE ================== */
function backendSupabase(){
  let sb, uidCache=null;
  const pronto = import('https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm').then(m=>{ sb=m.createClient(CONFIG.SUPABASE_URL, CONFIG.SUPABASE_ANON_KEY); return sb; });
  const ok = ({data,error}) => { if(error) throw error; return data; };
  const self = {
    pronto,
    onAuth(cb){ pronto.then(()=>sb.auth.onAuthStateChange((ev)=>cb(ev))); },
    async sessao(){ await pronto; const {data}=await sb.auth.getSession(); uidCache=data.session?.user?.id||null; return data.session ? {uid:data.session.user.id, email:data.session.user.email} : null; },
    async entrar(email,senha){ await pronto; ok(await sb.auth.signInWithPassword({email,password:senha})); },
    async criarConta(email,senha,perfil){ await pronto; const d=ok(await sb.auth.signUp({email,password:senha,options:{data:perfil,emailRedirectTo:location.origin+location.pathname}})); return !!d.session; },
    async esqueci(email){ await pronto; ok(await sb.auth.resetPasswordForEmail(email,{redirectTo:location.origin+location.pathname})); },
    async novaSenha(senha){ await pronto; ok(await sb.auth.updateUser({password:senha})); },
    async sair(){ await pronto; await sb.auth.signOut(); },
    async perfil(){ const s=await self.sessao(); if(!s) return null; return ok(await sb.from('perfis').select('*').eq('id',s.uid).maybeSingle()) || {id:s.uid,email:s.email}; },
    async salvarPerfil(p){ const s=await self.sessao(); ok(await sb.from('perfis').upsert({...p, id:s.uid, email:s.email})); },
    async ehEquipe(){ await pronto; const {data,error}=await sb.rpc('is_equipe'); return !error && !!data; },
    async criar(linha){ await pronto; return ok(await sb.from('solicitacoes').insert(linha).select().single()); },
    async minhas(){ const s=await self.sessao(); return ok(await sb.from('solicitacoes').select('*').eq('user_id',s.uid).order('criado_em',{ascending:false}).limit(300)); },
    async todas(status){ await pronto; let q=sb.from('solicitacoes').select('*').order('criado_em',{ascending:false}).limit(1000); if(status) q=q.eq('status',status); return ok(await q); },
    async contar(status){ await pronto; const {count}=await sb.from('solicitacoes').select('id',{count:'exact',head:true}).eq('status',status); return count||0; },
    async obter(id){ await pronto; return ok(await sb.from('solicitacoes').select('*').eq('id',id).maybeSingle()); },
    async atualizar(id,patch){ await pronto; return ok(await sb.from('solicitacoes').update(patch).eq('id',id).select().single()); },
    async uid(){ if(uidCache) return uidCache; const s=await self.sessao(); return s?.uid; },
  };
  return self;
}

/* ================== BACKEND: DEMONSTRAÇÃO (sem servidor) ================== */
function backendDemo(){
  const mem={};
  const ler=(k,d)=>{ try{ const v=localStorage.getItem(k); return v?JSON.parse(v):(mem[k]??d); }catch{ return mem[k]??d; } };
  const gravar=(k,v)=>{ mem[k]=v; try{ localStorage.setItem(k,JSON.stringify(v)); }catch{} };
  const cbs=[];
  const self = {
    pronto: Promise.resolve(),
    onAuth(cb){ cbs.push(cb); },
    async sessao(){ return ler('tl_demo_sessao',null); },
    async entrar(email,senha){ const us=ler('tl_demo_users',{}); const u=Object.values(us).find(u=>u.email===email.toLowerCase()); if(!u||u.senha!==senha) throw new Error('Invalid login credentials'); gravar('tl_demo_sessao',{uid:u.uid,email:u.email}); },
    async criarConta(email,senha,perfil){ email=email.toLowerCase(); const us=ler('tl_demo_users',{}); if(Object.values(us).some(u=>u.email===email)) throw new Error('already registered'); if(senha.length<6) throw new Error('Password should be at least 6'); const uid='u'+Date.now(); us[uid]={uid,email,senha}; gravar('tl_demo_users',us); const ps=ler('tl_demo_perfis',{}); ps[uid]={id:uid,email,...perfil}; gravar('tl_demo_perfis',ps); gravar('tl_demo_sessao',{uid,email}); return true; },
    async esqueci(){ },
    async novaSenha(){ },
    async sair(){ gravar('tl_demo_sessao',null); cbs.forEach(c=>c('SIGNED_OUT')); },
    async perfil(){ const s=await self.sessao(); return s ? (ler('tl_demo_perfis',{})[s.uid]||{id:s.uid,email:s.email}) : null; },
    async salvarPerfil(p){ const s=await self.sessao(); const ps=ler('tl_demo_perfis',{}); ps[s.uid]={...ps[s.uid],...p}; gravar('tl_demo_perfis',ps); },
    async ehEquipe(){ return !!ler('tl_demo_equipe',false); },
    async criar(l){ const s=await self.sessao(); const all=ler('tl_demo_sol',[]); const id=(all.reduce((m,r)=>Math.max(m,r.id),0)||0)+1; const r={id,user_id:s.uid,criado_em:new Date().toISOString(),status:'enviada',...l}; all.push(r); gravar('tl_demo_sol',all); return r; },
    async minhas(){ const s=await self.sessao(); return ler('tl_demo_sol',[]).filter(r=>r.user_id===s.uid).sort((a,b)=>b.id-a.id); },
    async todas(st){ return ler('tl_demo_sol',[]).filter(r=>!st||r.status===st).sort((a,b)=>b.id-a.id); },
    async contar(st){ return ler('tl_demo_sol',[]).filter(r=>r.status===st).length; },
    async obter(id){ return ler('tl_demo_sol',[]).find(r=>r.id==id)||null; },
    async atualizar(id,p){ const all=ler('tl_demo_sol',[]); const i=all.findIndex(r=>r.id==id); all[i]={...all[i],...p,atualizado_em:new Date().toISOString()}; gravar('tl_demo_sol',all); return all[i]; },
    async uid(){ return (await self.sessao())?.uid; },
    setEquipe(v){ gravar('tl_demo_equipe',!!v); },
  };
  return self;
}

    criar: `<h2>Criar conta</h2>
      <p style="font-size:14px;color:var(--suave);margin-top:-8px">Cadastro para clínicas e médicos-veterinários que enviam exames ao Tec Lab.</p>

      <label class="f"><span>E-mail (será o seu login)</span><input id="email" type="email" autocomplete="username" inputmode="email"></label>
      <label class="f"><span>Senha (mínimo 6 caracteres)</span><input id="senha" type="password" autocomplete="new-password"></label>
      <button class="btn" id="ir">Criar conta</button>
      <div class="alt"><a href="#" data-m="entrar">Já tenho conta</a></div>`,
    esqueci: `<h2>Recuperar senha</h2>
      <p style="font-size:14px;color:var(--suave);margin-top:-8px">Vamos enviar um link para você criar uma nova senha.</p>
      <label class="f"><span>E-mail</span><input id="email" type="email" inputmode="email"></label>
      <button class="btn" id="ir">Enviar link</button>
      <div class="alt"><a href="#" data-m="entrar">Voltar</a></div>`,
    nova: `<h2>Nova senha</h2>
      <label class="f"><span>Nova senha (mínimo 6 caracteres)</span><input id="senha" type="password" autocomplete="new-password"></label>
      <button class="btn" id="ir">Salvar senha</button>`,
  };
  app.innerHTML = `${DEMO?`<div class="demo-faixa"><b>Modo demonstração</b> — crie uma conta qualquer para testar; os dados ficam só neste navegador.</div>`:''}

  $$('[data-m]').forEach(a=>a.onclick=e=>{e.preventDefault();telaLogin(a.dataset.m)});
  const erro = t => { const m=$('#msg'); m.className='msg erro'; m.textContent=t; };
  const btn=$('#ir');
  $$('.login input').forEach(i=>i.addEventListener('keydown',e=>{ if(e.key==='Enter') btn.click(); }));
  btn.onclick = async ()=>{
    const v = id => ($('#'+id)?.value||'').trim();
    btn.disabled=true;
    try{
      if(modo==='entrar'){ if(!v('email')||!v('senha')) throw new Error('Informe e-mail e senha.'); await api.entrar(v('email'), $('#senha').value); estado.perfil=null; location.hash='#/'; await rota(); }
      else if(modo==='criar'){
        if(!v('nome')) throw new Error('Informe o nome do(a) veterinário(a) responsável.');
        if(!v('crmv')) throw new Error('Informe o CRMV.');
        if(!v('email')) throw new Error('Informe o e-mail.');

        else telaLogin('entrar','Conta criada! Enviamos um link de confirmação para o seu e-mail.');
      }

  };
}

function coletar(pontos){
  const val = s => ($(s)?.value||'').trim();
  const radio = n => $(`input[name=${n}]:checked`)?.value ?? null;
  const exames = [];
  CATALOGO.forEach(sec=>sec.itens.forEach((it,i)=>{
    const el=$(`.item[data-k="${sec.id}-${i}"]`); if(!el || !$('[data-ck]',el).checked) return;
    const ex = { k:`${sec.id}-${i}`, secao:sec.titulo, nome:it.n };
    const lado=$$('[data-lado]:checked',el).map(c=>c.dataset.lado); if(lado.length) ex.lado=lado;
    const opts=$$('[data-opt]:checked',el).map(c=>c.dataset.opt); if(opts.length) ex.opts=opts;
    const t=$('[data-texto]',el)?.value.trim(); if(t) ex.texto=t;
    const pj=$('[data-proj]',el)?.value.trim(); if(pj) ex.proj=pj;
    const lc=$('[data-local]',el)?.value.trim(); if(lc) ex.local=lc;
    if(it.d) ex.composicao=it.d;
    if(it.jejum) ex.jejum12h=true;
    ex.descricao = descreverExame(ex);
    exames.push(ex);
  }));
  const flags={}; $$('[data-flag]').forEach(c=>flags[c.dataset.flag]=c.checked);
  const obs={}; $$('[data-obs]').forEach(c=>{ if(c.value.trim()) obs[c.dataset.obs]=c.value.trim(); });
  const pato={}; $$('[data-pato]').forEach(c=>{ if(c.value.trim()) pato[c.dataset.pato]=c.value.trim(); });
  pato.locais=$$('[data-localbx]:checked').map(c=>c.dataset.localbx);
  pato.mapa=pontos.slice();
  const extras={}; $$('[data-extra]').forEach(c=>{ if(c.value.trim()) extras[c.dataset.extra]=c.value.trim(); });
  const jj=radio('jejum'); if(jj) extras.jejum=jj;
  return {
    versao:1,
    data: new Date().toLocaleDateString('pt-BR'),
    flags,
    paciente:{ nome:val('[data-p=nome]').toUpperCase(), sexo:radio('sexo'), idade:val('[data-p=idade]'), especie:radio('especie'), especie_outra:val('[data-p=especie_outra]'), raca:val('[data-p=raca]'), responsavel:val('[data-p=responsavel]'), cpf:val('[data-p=cpf]'), telefone:val('[data-p=telefone]') },
    vet:{ nome:val('[data-v=nome]'), crmv:val('[data-v=crmv]'), clinica:val('[data-v=clinica]') },
    exames,
    radiografia:{ sedacao: radio('sed') },
    endocrino:{ encaminhar: radio('enc') || null },
    obs, patologia:pato, extras,
  };
}
function descreverExame(ex){
  let s = ex.nome;
  if(ex.texto) s += ': ' + ex.texto;
  if(ex.lado) s += ' (' + ex.lado.map(l=>l==='D'?'Direito':'Esquerdo').join(' e ') + ')';
  if(ex.opts) s += ' – ' + ex.opts.join(' + ');
  if(ex.proj) s += ' – projeção: ' + ex.proj;
  if(ex.local) s += ' – local: ' + ex.local;
  return s;
}
function textoSolicitacao(r){
  if(!r) return '';
  const d=r.dados, p=d.paciente, f=d.flags||{};
  const L=[];
  L.push(`${cod(r.id)} — ${STATUS[r.status]?.t||r.status} — enviada em ${dh(r.criado_em)}`);
  const fl=[f.urgente&&'URGENTE (com taxa)',f.petlove&&'PET LOVE',f.convenio&&'Convênio',f.pago&&'Pago'].filter(Boolean); if(fl.length) L.push('Marcações: '+fl.join(', '));
  L.push(`Paciente: ${p.nome} | Sexo: ${p.sexo||'-'} | Idade: ${p.idade||'-'} | Espécie: ${p.especie==='Outra'?p.especie_outra:(p.especie||'-')} | Raça: ${p.raca||'-'}`);
  L.push(`Responsável: ${p.responsavel||'-'} | CPF: ${p.cpf||'-'} | Telefone: ${p.telefone||'-'}`);
  L.push(`Veterinário: ${d.vet.nome} | CRMV: ${d.vet.crmv||'-'} | Clínica: ${d.vet.clinica||'-'}`);
  L.push('Exames:'); d.exames.forEach(e=>L.push(`  - [${e.secao}] ${e.descricao}`));
  if(d.extras?.outros_exames) L.push('Outros exames: '+d.extras.outros_exames);
  if(d.radiografia?.sedacao) L.push('Radiografia – sedação: '+d.radiografia.sedacao);
  if(d.endocrino?.encaminhar) L.push('Endocrinologia – encaminhar para: '+d.endocrino.encaminhar);
  Object.entries(d.obs||{}).forEach(([k,v])=>L.push(`Obs./suspeita (${k==='rx'?'radiografia':k==='us'?'ultrassom':k}): ${v}`));
  const pt=d.patologia||{}; if(pt.lesao||pt.tempo||pt.obs||pt.locais?.length||pt.outro_local||pt.mapa?.length){
    L.push(`Patologia – lesão: ${pt.lesao||'-'} | tempo de evolução: ${pt.tempo||'-'} | obs.: ${pt.obs||'-'}`);
    const locs=[...(pt.locais||[]), pt.outro_local].filter(Boolean); if(locs.length) L.push('Local da biópsia/citologia: '+locs.join(', '));
    if(pt.mapa?.length) L.push(`Pontos marcados na silhueta: ${pt.mapa.length} (${pt.mapa.map(m=>m.lado).join(', ')})`);
  }
  if(d.extras?.jejum) L.push('Jejum: '+d.extras.jejum);
  if(d.extras?.observacoes) L.push('Suspeita/observações: '+d.extras.observacoes);
  if(d.extras?.medicamentos) L.push('Medicamentos: '+d.extras.medicamentos);
  if(r.ficha_workvet) L.push('Ficha WorkVet: '+r.ficha_workvet);
  if(r.motivo_recusa) L.push('Motivo da recusa: '+r.motivo_recusa);
  return L.join('\n');
}

  }
  moldura(`
  ${recemEnviada?`<div class="msg ok nao-imprimir"><b>Solicitação enviada!</b> Código <b>${cod(r.id)}</b>. A recepção do Tec Lab vai conferir e aceitar; acompanhe aqui em "Minhas solicitações". Se quiser, escreva o código no material enviado.</div>`:''}
  ${acoesEq}
  <div class="ver-cab nao-imprimir">
    <a class="btn sec peq" href="${estado.equipe?'#/painel':'#/minhas'}">← Voltar</a><div class="esp"></div>
    ${meu && r.status==='enviada' ? `<a class="btn sec peq" href="#/editar/${r.id}">Editar</a><button class="btn perigo peq" id="cancelar">Cancelar solicitação</button>`:''}
    ${meu ? `<a class="btn sec peq" href="#/modelo/${r.id}">Usar como modelo</a>`:''}
    <button class="btn peq" onclick="print()">Imprimir / PDF</button>
  </div>
  <div class="folha">
    <div class="cab">
      <div class="marca"><img src="${LOGO}" alt="Tec Lab"><div>Centro Diagnóstico Veterinário</div></div>
      <div class="dir"><h1>Requisição Individual de Exames</h1>
        <div class="cod">${cod(r.id)}</div>
        <div style="margin-top:6px"><span class="st ${st.c}">${st.t}${r.status==='cadastrada'&&r.ficha_workvet?' · ficha '+h(r.ficha_workvet):''}</span>${r.urgente?'<span class="tag-urg">URGENTE (com taxa)</span>':''}</div>
        ${flagsTxt.length?`<div class="flags" style="font-size:17px">${flagsTxt.map(t=>`<span>☑ ${t}</span>`).join('')}</div>`:''}
        ${r.status==='recusada'&&r.motivo_recusa?`<div class="msg erro" style="margin-top:10px">Motivo: ${h(r.motivo_recusa)}</div>`:''}
      </div>
    </div>
    <div class="dados-grade">
      <div class="dado"><span>Paciente</span><b>${h(p.nome)}</b></div>
      <div class="dado"><span>Espécie / raça</span><b>${h(p.especie==='Outra'?p.especie_outra:p.especie)}${p.raca?' – '+h(p.raca):''}</b></div>
      <div class="dado"><span>Sexo / idade</span><b>${h(p.sexo||'–')} · ${h(p.idade||'–')}</b></div>
      <div class="dado"><span>Responsável</span><b>${h(p.responsavel||'–')}</b></div>
      <div class="dado"><span>CPF</span><b>${h(p.cpf||'–')}</b></div>
      <div class="dado"><span>Telefone</span><b>${h(p.telefone||'–')}</b></div>
      <div class="dado"><span>Médico veterinário</span><b>${h(d.vet.nome)}</b></div>
      <div class="dado"><span>CRMV</span><b>${h(d.vet.crmv||'–')}</b></div>
      <div class="dado"><span>Clínica</span><b>${h(d.vet.clinica||'–')}</b></div>
      <div class="dado"><span>Enviada em</span><b>${dh(r.criado_em)}</b></div>
    </div>
    <hr class="div">
    ${Object.entries(grupos).map(([sec,exs])=>`<div class="ver-sec"><span class="pill sec">${h(sec)}</span><ul>${exs.map(e=>`<li>${h(e.descricao)}${e.composicao?` <small>(${h(e.composicao)})</small>`:''}${e.jejum12h?' <small><b>Jejum 12h</b></small>':''}</li>`).join('')}</ul>
      ${sec==='Radiografia Simples'&&d.radiografia?.sedacao?`<p style="margin:6px 0 0 20px">Sedação: <b>${h(d.radiografia.sedacao)}</b></p>`:''}
      ${sec==='Radiografia Simples'&&d.obs?.rx?`<p style="margin:6px 0 0 20px">Obs./suspeita: ${h(d.obs.rx)}</p>`:''}
      ${sec==='Ultrassonografia'&&d.obs?.us?`<p style="margin:6px 0 0 20px">Obs./suspeita: ${h(d.obs.us)}</p>`:''}
      ${sec==='Endocrinologia'&&d.endocrino?.encaminhar?`<p style="margin:6px 0 0 20px">Encaminhar para: <b>${h(d.endocrino.encaminhar)}</b></p>`:''}
    </div>`).join('')}
    ${d.extras?.outros_exames?`<div class="ver-sec"><span class="pill sec">Outros exames</span><p style="margin:8px 0 0;white-space:pre-wrap">${h(d.extras.outros_exames)}</p></div>`:''}
    ${(pt.lesao||pt.tempo||pt.obs||locs.length||pt.mapa?.length)?`<div class="ver-sec"><span class="pill sec">Patologia – dados da lesão</span>
      <div class="mapa-wrap"><div style="flex:1;min-width:220px;font-size:15px;line-height:1.6">
        ${pt.lesao?`<div><b>Lesão:</b> ${h(pt.lesao)}</div>`:''}${pt.tempo?`<div><b>Tempo de evolução:</b> ${h(pt.tempo)}</div>`:''}${pt.obs?`<div><b>Obs./suspeita:</b> ${h(pt.obs)}</div>`:''}
        ${locs.length?`<div><b>Localização:</b> ${h(locs.join(', '))}</div>`:''}</div>
        ${pt.mapa?.length?`<div class="mapa" style="width:260px"><div class="rot"><span>Ventral</span><span>Dorsal</span></div><div class="img" style="cursor:default"><img src="${CORPO}" alt="">${pt.mapa.map((m,i)=>`<div class="ponto" style="left:${+m.x}%;top:${+m.y}%;cursor:default">${i+1}</div>`).join('')}</div></div>`:''}
      </div></div>`:''}
    ${(d.extras?.jejum||d.extras?.observacoes||d.extras?.medicamentos)?`<div class="ver-sec"><span class="pill sec">Informações clínicas</span><div style="margin-top:8px;font-size:15px;line-height:1.6;white-space:pre-wrap">${d.extras.jejum?`<div><b>Jejum:</b> ${h(d.extras.jejum)}</div>`:''}${d.extras.observacoes?`<div><b>Suspeita / observações:</b> ${h(d.extras.observacoes)}</div>`:''}${d.extras.medicamentos?`<div><b>Medicamentos em uso:</b> ${h(d.extras.medicamentos)}</div>`:''}</div></div>`:''}
    <p class="cert" style="margin-top:20px">☑ Certifico que o material enviado corresponde ao paciente descrito na ficha.</p>
    <div class="rodape">Rua José do Patrocínio, 108 – Cidade Nova I – CEP 13.334-120<br>Telefones: (19) 3329-7866 / (19) 3885-3363 · WhatsApp: (19) 9 9968-0358 · @teclab.vet</div>
  </div>`);
  $('#cancelar')?.addEventListener('click', async ()=>{
    if(!await modal({titulo:'Cancelar solicitação?', html:`<p>${cod(r.id)} – ${h(p.nome)}. A recepção não vai mais receber este pedido.</p>`, ok:'Cancelar solicitação', cancelar:'Voltar', perigo:true})) return;
    try{ await api.atualizar(r.id,{status:'cancelada'}); toast('Solicitação cancelada.'); telaVer(r.id); }catch(e){ toast(traduzErro(e)); }
  });
  $$('[data-ac]').forEach(b=>b.onclick=async ()=>{
    const ac=b.dataset.ac; let patch=null;
    try{
      if(ac==='aceitar') patch={status:'aceita', aceita_em:new Date().toISOString(), aceita_por: await api.uid()};
      if(ac==='recusar'){ const v=await modal({titulo:'Recusar solicitação', campos:[{k:'motivo',rotulo:'Motivo (o veterinário vai ver)',obrig:true}], ok:'Recusar', perigo:true}); if(!v) return; patch={status:'recusada', motivo_recusa:v.motivo}; }
      if(ac==='cadastrada'||ac==='ficha'){ const v=await modal({titulo:'Cadastrada no WorkVet', campos:[{k:'ficha',rotulo:'Nº da ficha no WorkVet',valor:r.ficha_workvet||'',ph:'ex.: 0107407'}], ok:'Salvar'}); if(!v) return; patch={status:'cadastrada', ficha_workvet:v.ficha||null, cadastrada_em:r.cadastrada_em||new Date().toISOString()}; }
      if(ac==='voltar') patch={status:'enviada', motivo_recusa:null};
      if(ac==='copiar'){ await navigator.clipboard.writeText(textoSolicitacao(r)); toast('Texto copiado.'); return; }
      await api.atualizar(r.id, patch); toast('Atualizado.'); telaVer(r.id);
    }catch(e){ toast(traduzErro(e),4000); }
  });
}

/* ================== MINHAS SOLICITAÇÕES ================== */
function resumoExames(r){
  const n=r.dados?.exames||[]; const nomes=n.map(e=>e.nome);
  if(r.dados?.extras?.outros_exames) nomes.push('outros: '+r.dados.extras.outros_exames.slice(0,40));
  return h(nomes.slice(0,4).join(', ')) + (nomes.length>4?` <span style="color:var(--suave)">+${nomes.length-4}</span>`:'');
}
async function telaMinhas(){
  moldura(`<div class="carregando">Carregando…</div>`);
  let rs=[]; try{ rs=await api.minhas(); }catch(e){ moldura(`<div class="msg erro">${h(traduzErro(e))}</div>`); return; }
  moldura(`
  <div class="cab-lista"><h2>Minhas solicitações</h2><a class="btn" href="#/nova">+ Nova solicitação</a></div>
  ${rs.length? rs.map(r=>{ const st=STATUS[r.status]||{t:r.status,c:''}; return `
    <div class="cartao">
      <div class="info">
        <div class="t">${h(r.paciente)} <span style="font-weight:normal;color:var(--suave)">· ${h(r.especie||'')}</span>${r.urgente?'<span class="tag-urg">URGENTE</span>':''}</div>
        <div class="m">${cod(r.id)} · ${dh(r.criado_em)}${r.veterinario?' · '+h(r.veterinario):''}</div>
        <div class="ex">${resumoExames(r)}</div>
        ${r.status==='recusada'&&r.motivo_recusa?`<div class="m" style="color:var(--erro)">Motivo: ${h(r.motivo_recusa)}</div>`:''}
      </div>
      <div style="display:flex;flex-direction:column;gap:8px;align-items:flex-end">
        <span class="st ${st.c}">${st.t}${r.status==='cadastrada'&&r.ficha_workvet?' · ficha '+h(r.ficha_workvet):''}</span>
        <div class="acoes"><a class="btn sec peq" href="#/ver/${r.id}">Ver</a>${r.status==='enviada'?`<a class="btn sec peq" href="#/editar/${r.id}">Editar</a>`:''}<a class="btn sec peq" href="#/modelo/${r.id}">Repetir</a></div>
      </div>
    </div>`; }).join('') : `<div class="vazio">Você ainda não fez nenhuma solicitação.<br><br><a class="btn" href="#/nova">Fazer a primeira</a></div>`}`);
}

/* ================== PAINEL DA EQUIPE ================== */
async function telaPainel(){
  if(!estado.equipe){ location.hash='#/minhas'; return; }
  moldura(`<div class="carregando">Carregando…</div>`);
  let todas=[]; try{ todas=await api.todas(null); }catch(e){ moldura(`<div class="msg erro">${h(traduzErro(e))}</div>`); return; }
  const cont = s => todas.filter(r=>r.status===s).length;
  const abas=[['enviada','Novas'],['aceita','Aceitas'],['cadastrada','Cadastradas'],['recusada','Recusadas'],['cancelada','Canceladas'],['','Todas']];
  const f=estado.painelFiltro, q=estado.busca.toLowerCase();
  const lista = todas.filter(r=>(!f||r.status===f) && (!q || [cod(r.id),r.paciente,r.clinica,r.veterinario,r.responsavel,r.ficha_workvet].join(' ').toLowerCase().includes(q)));
  document.title = (cont('enviada')?`(${cont('enviada')}) `:'') + 'Painel · Solicitações Tec Lab';
  moldura(`
  <div class="cab-lista"><h2>Painel Tec Lab</h2>
    <input class="busca" id="busca" placeholder="Buscar paciente, clínica, vet, código…" value="${h(estado.busca)}">
    <button class="btn sec peq" id="csv">Exportar planilha</button></div>
  <div class="abas">${abas.map(([s,t])=>`<button data-f="${s}" class="${f===s?'on':''}">${t}${s?`<span class="n">${cont(s)}</span>`:''}</button>`).join('')}</div>
  ${lista.length?`<table class="tabela"><thead><tr><th>Código</th><th>Recebida</th><th>Clínica / Vet</th><th>Paciente</th><th class="opc">Exames</th><th>Situação</th></tr></thead><tbody>
  ${lista.map(r=>{ const st=STATUS[r.status]||{t:r.status,c:''}; return `<tr class="click ${r.status==='enviada'?'novo':''}" data-id="${r.id}">
    <td><b>${cod(r.id)}</b>${r.urgente?'<br><span class="tag-urg" style="margin:0">URGENTE</span>':''}</td>
    <td>${dataBR(r.criado_em)}<br><span style="color:var(--suave)">${horaBR(r.criado_em)}</span></td>
    <td>${h(r.clinica||'–')}<br><span style="color:var(--suave)">${h(r.veterinario||'')}${r.crmv?' · '+h(r.crmv):''}</span></td>
    <td>${h(r.paciente)}<br><span style="color:var(--suave)">${h(r.especie||'')}${r.responsavel?' · '+h(r.responsavel):''}</span></td>
    <td class="opc">${resumoExames(r)}</td>
    <td><span class="st ${st.c}">${st.t}</span>${r.ficha_workvet?`<br><span style="font-size:12px">ficha ${h(r.ficha_workvet)}</span>`:''}</td></tr>`; }).join('')}
  </tbody></table>`:`<div class="vazio">Nenhuma solicitação ${f?'nesta aba':''}.</div>`}`);
  $$('.abas button').forEach(b=>b.onclick=()=>{ estado.painelFiltro=b.dataset.f; telaPainel(); });
  $$('tr[data-id]').forEach(tr=>tr.onclick=()=>location.hash='#/ver/'+tr.dataset.id);
  const bs=$('#busca'); let tm; bs.oninput=()=>{ clearTimeout(tm); tm=setTimeout(()=>{ estado.busca=bs.value; telaPainel().then(()=>{ const n=$('#busca'); n.focus(); n.setSelectionRange(n.value.length,n.value.length); }); },300); };
  $('#csv').onclick=()=>exportarCSV(lista);
  clearInterval(estado.pollTimer);
  const novasAntes=cont('enviada');
  estado.pollTimer=setInterval(async ()=>{
    if(!location.hash.startsWith('#/painel')){ clearInterval(estado.pollTimer); return; }
    try{ const n=await api.contar('enviada'); if(n!==novasAntes){ if(n>novasAntes) toast('Nova solicitação recebida!'); if(!$('.modal-fundo') && document.activeElement?.id!=='busca') telaPainel(); } }catch{}
  }, 30000);
}
function exportarCSV(rs){
  const cab=['Código','Recebida em','Situação','Urgente','Clínica','Veterinário','CRMV','Paciente','Espécie','Raça','Sexo','Idade','Responsável','CPF','Telefone','Exames','Outros exames','Observações','Ficha WorkVet'];
  const esc=v=>`"${String(v??'').replace(/"/g,'""')}"`;
  const linhas=rs.map(r=>{ const d=r.dados||{}, p=d.paciente||{}; return [cod(r.id),dh(r.criado_em),STATUS[r.status]?.t||r.status,r.urgente?'Sim':'',r.clinica,r.veterinario,r.crmv,r.paciente,r.especie,p.raca,p.sexo,p.idade,r.responsavel,p.cpf,p.telefone,(d.exames||[]).map(e=>e.descricao).join(' | '),d.extras?.outros_exames,d.extras?.observacoes,r.ficha_workvet].map(esc).join(';'); });
  const blob=new Blob(['﻿'+[cab.map(esc).join(';'),...linhas].join('\r\n')],{type:'text/csv;charset=utf-8'});
  const a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download=`solicitacoes-teclab-${new Date().toISOString().slice(0,10)}.csv`; a.click(); setTimeout(()=>URL.revokeObjectURL(a.href),2000);
}

/* ================== MEU CADASTRO ================== */
async function telaPerfil(){
  const p=estado.perfil||{};
  moldura(`<div class="login" style="margin-top:10px"><h2>Meu cadastro</h2>
    <p style="font-size:14px;color:var(--suave);margin-top:-8px">Esses dados já vêm preenchidos em cada nova solicitação.</p>
    <label class="f"><span>Clínica</span><input id="clinica" value="${h(p.clinica||'')}"></label>
    <label class="f"><span>Médico(a)-veterinário(a) responsável</span><input id="nome" value="${h(p.nome||'')}"></label>
    <label class="f"><span>CRMV</span><input id="crmv" value="${h(p.crmv||'')}"></label>
    <label class="f"><span>WhatsApp</span><input id="telefone" value="${h(p.telefone||'')}"></label>
    <label class="f"><span>E-mail de login</span><input value="${h(p.email||'')}" disabled></label>
    <button class="btn" id="salvar">Salvar</button></div>`);
  $('#salvar').onclick=async ()=>{ const v=id=>$('#'+id).value.trim(); try{ await api.salvarPerfil({clinica:v('clinica'),nome:v('nome'),crmv:v('crmv'),telefone:v('telefone')}); estado.perfil=await api.perfil(); toast('Cadastro salvo.'); location.hash='#/'; }catch(e){ toast(traduzErro(e),4000); } };
}

/* ================== ROTEADOR ================== */
async function rota(){
  try{
    if(/type=recovery/.test(location.hash) || estado.recuperacao){ estado.recuperacao=true; if(await api.sessao()) return telaLogin('nova'); }
    const s = await api.sessao();
    if(!s) return telaLogin();
    if(!estado.perfil){ estado.perfil = await api.perfil(); estado.equipe = await api.ehEquipe(); }
    const [ , r, id ] = (location.hash.split('?')[0] || '#/').split('/');
    if(r!=='painel'){ document.title='Solicitações online · Tec Lab'; }
    switch(r){
      case 'nova': return telaForm();
      case 'editar': return telaForm(id);
      case 'modelo': return telaForm(id,{modelo:true});
      case 'ver': return telaVer(id);
      case 'minhas': return telaMinhas();
      case 'perfil': return telaPerfil();
      case 'painel': return telaPainel();
      default: return estado.equipe ? telaPainel() : telaMinhas();
    }
  }catch(e){ app.innerHTML=`<main><div class="msg erro">${h(traduzErro(e))}</div><button class="btn" onclick="location.reload()">Tentar de novo</button></main>`; }
}
api.onAuth(ev=>{ if(ev==='PASSWORD_RECOVERY'){ estado.recuperacao=true; telaLogin('nova'); } else if(ev==='SIGNED_OUT'){ estado.perfil=null; } });
window.addEventListener('hashchange', ()=>{ if(!/access_token|type=recovery/.test(location.hash)) rota(); });
rota();
if('serviceWorker' in navigator && location.protocol==='https:' && !DEMO) navigator.serviceWorker.register('sw.js').catch(()=>{});
</script>
